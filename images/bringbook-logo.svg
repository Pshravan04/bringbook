  <!-- Wordmark in Plus Jakarta Sans -->
  <text x="36" y="25" font-family="'Plus Jakarta Sans', -apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#111827" letter-spacing="-0.03em">bring<tspan fill="#16A34A">book</tspan></text>
</svg>
