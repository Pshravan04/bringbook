    <path d="M14 2C8 2 2 7 2 15C2 23 8 28 14 28V2Z" fill="#16A34A" />
    <!-- Right Leaf/Page -->
    <path d="M14 2C20 2 26 7 26 15C26 23 20 28 14 28V2Z" fill="#15803D" />
    <!-- Center Spine Spine Line -->
